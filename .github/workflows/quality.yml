name: Quality checks

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/quality.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify content and links
        run: npm run check
      - name: Build static site
        run: npm run build
